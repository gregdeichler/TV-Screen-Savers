<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101113">
  <meta name="color-scheme" content="dark">
  <title>The Deichlers — Family Screensaver</title>
  <style>
    :root { color-scheme: dark; background: #101113; }
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#101113; }
    body { user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; }
    #viewport { position:fixed; top:0; right:0; bottom:0; left:0; overflow:hidden; background:#101113; }
    #composition { position:absolute; top:-1%; right:-1%; bottom:-1%; left:-1%; transform-origin:50% 50%; animation:drift 560s ease-in-out infinite alternate; }
    #scene { position:absolute; top:0; right:0; bottom:0; left:0; width:100%; height:100%; object-fit:cover; }
    #clock {
      position:absolute; width:33.8%; height:auto;
      left:76.6%; top:45.7%; transform:translate(-50%,-50%);
      overflow:visible; filter:drop-shadow(0 12px 22px rgba(0,0,0,.35));
    }
    .hand { transform-box:fill-box; transform-origin:center; }
    #hourHand, #minuteHand { transform-origin:500px 500px; }
    @keyframes drift {
      0%   {transform:translate(-0.45%,-0.25%) scale(1.006);}
      25%  {transform:translate(0.25%, 0.45%) scale(1.009);}
      50%  {transform:translate(0.4%,-0.35%) scale(1.008);}
      75%  {transform:translate(-0.35%,0.4%) scale(1.009);}
      100% {transform:translate(0.35%,-0.15%) scale(1.006);}
    }
    @media (prefers-reduced-motion:reduce) { #composition { animation:none; } }
  </style>
</head>
<body>
  <main id="viewport" role="img" aria-label="Deichlers family crest beside a live silver analog clock on a matte charcoal background">
    <div id="composition">
      <img id="scene" src="assets/scene.webp" alt="" draggable="false">
      <svg id="clock" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#555960"/><stop offset="19%" stop-color="#d5d7d9"/>
            <stop offset="36%" stop-color="#5f646b"/><stop offset="58%" stop-color="#f0f0ee"/>
            <stop offset="76%" stop-color="#646a71"/><stop offset="100%" stop-color="#a5abb1"/>
          </linearGradient>
          <linearGradient id="handMetal" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f8f9f8"/><stop offset="0.42" stop-color="#aeb4bb"/><stop offset="1" stop-color="#58626c"/>
          </linearGradient>
          <radialGradient id="dial" cx="45%" cy="42%" r="74%">
            <stop offset="0%" stop-color="#16181b"/><stop offset="67%" stop-color="#111315"/><stop offset="100%" stop-color="#08090b"/>
          </radialGradient>
        </defs>
        <circle cx="500" cy="500" r="487" fill="#08090a" stroke="#050607" stroke-width="8" />
        <circle cx="500" cy="500" r="480" fill="none" stroke="url(#silver)" stroke-width="12"/>
        <circle cx="500" cy="500" r="466" fill="url(#dial)" stroke="#53585d" stroke-width="3"/>
        <circle cx="500" cy="500" r="448" fill="none" stroke="#969ca1" stroke-opacity="0.55" stroke-width="1.8"/>
        <g id="ticks"></g>
        <g id="numerals"></g>
        <g id="hourHand" transform="rotate(0 500 500)">
          <path d="M 497 552 L 486 491 L 489 409 L 500 242 L 511 409 L 514 491 L 503 552 Z" fill="url(#handMetal)" stroke="#e8e9e8" stroke-width="2"/>
          <path d="M 500 252 L 500 544" stroke="#33383f" stroke-width="1.8"/>
        </g>
        <g id="minuteHand" transform="rotate(0 500 500)">
          <path d="M 496 550 L 490 488 L 494 366 L 500 157 L 506 366 L 510 488 L 504 550 Z" fill="url(#handMetal)" stroke="#e5e8ea" stroke-width="1.5"/>
          <path d="M 500 166 L 500 543" stroke="#33383f" stroke-width="1.3"/>
        </g>
        <circle cx="500" cy="500" r="22" fill="#3b4147" stroke="url(#silver)" stroke-width="6"/>
        <circle cx="500" cy="500" r="11" fill="url(#silver)"/>
      </svg>
    </div>
  </main>
  <script>
    (function () {
      'use strict';
      var ns = 'http://www.w3.org/2000/svg';
      var ticks = document.getElementById('ticks');
      var nums = document.getElementById('numerals');
      var roman = ['XII','I','II','III','IV','V','VI','VII','VIII','IX','X','XI'];
      function node(tag, attrs, parent, content) {
        var e = document.createElementNS(ns,tag);
        Object.keys(attrs).forEach(function(k){e.setAttribute(k, attrs[k]);});
        if (content !== undefined) e.textContent=content;
        parent.appendChild(e); return e;
      }
      for (var i=0; i<60; ++i) {
        var a=(i*6-90)*Math.PI/180, major=i%5===0;
        var outer=433, inner=major?414:423;
        node('line',{
          x1:(500+inner*Math.cos(a)).toFixed(2),y1:(500+inner*Math.sin(a)).toFixed(2),
          x2:(500+outer*Math.cos(a)).toFixed(2),y2:(500+outer*Math.sin(a)).toFixed(2),
          stroke:major?'#eef0f1':'#a3a8ad', 'stroke-width':major?'4':'2',
          'stroke-linecap':'round'
        },ticks);
      }
      for (var h=0;h<12;h++) {
        var theta=(h*30-90)*Math.PI/180, r=366;
        node('text',{
          x:(500+r*Math.cos(theta)).toFixed(2),
          y:(500+r*Math.sin(theta)+19).toFixed(2),
          'text-anchor':'middle', 'font-family':'Georgia, Times New Roman, serif',
          'font-size':'64','font-weight':'400', fill:'#e0e3e7',
          'letter-spacing':'-3'
        },nums,roman[h]);
      }
      var hourHand=document.getElementById('hourHand'), minuteHand=document.getElementById('minuteHand');
      var preview=(location.search.indexOf('preview=1')!==-1); // For artwork tests only; never set in deployment
      function updateClock() {
        var d=preview?new Date(2026,10,11,10,10,0):new Date();
        var minutes=d.getMinutes()+d.getSeconds()/60+d.getMilliseconds()/60000;
        var hours=d.getHours()%12+minutes/60;
        hourHand.setAttribute('transform','rotate('+(hours*30).toFixed(4)+' 500 500)');
        minuteHand.setAttribute('transform','rotate('+(minutes*6).toFixed(4)+' 500 500)');
      }
      updateClock();
      setInterval(updateClock,1000);
      document.addEventListener('visibilitychange',function(){if(!document.hidden)updateClock();});
      // Local browser convenience; platforms already show the application fullscreen.
      function enterFullscreen(){if(!document.fullscreenElement && document.documentElement.requestFullscreen){var p=document.documentElement.requestFullscreen(); if(p && p.catch) p.catch(function(){});}}
      document.addEventListener('dblclick', enterFullscreen);
      document.addEventListener('keydown',function(e){
        if((e.key==='f'||e.key==='F') && !e.ctrlKey && !e.metaKey && document.documentElement.requestFullscreen){enterFullscreen();}
        // Samsung TV back key
        if(e.keyCode===10009){try{window.tizen.application.getCurrentApplication().exit();}catch(err){history.back();}}
      });
      document.documentElement.setAttribute('data-clock-running','true');
    }());
  </script>
</body>
</html>
